name: iOS unsigned IPA

# 只在 ios 分支上跑，main 保持 Android 可发布状态不被牵连。
# public 仓库的 macOS runner 分钟数免费且不限量（私有仓库要按 10x 计费）。
on:
  push:
    branches: [ios]
  workflow_dispatch:

concurrency:
  group: ios-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.4
          channel: stable
          cache: true

      # 先打版本信息，构建挂了时用来判断是工具链漂移还是代码问题
      - name: 环境自检
        run: |
          flutter --version
          xcodebuild -version
          pod --version

      - name: 拉依赖
        run: flutter pub get

      # 先 --no-codesign 产出裸 .app，再补一层 ad-hoc 签名。
      # 为什么不能只留裸 .app：Sideloadly 0.60 对「主 bundle 完全未签名」的
      # IPA 会直接报 `Invalid file`（实测错误码 f65043@1006:23a71c，与
      # Predidit/Kazumi#1827 同款），它需要包里存在合法签名结构才能在本地重签。
      # ad-hoc（`-s -`）不需要任何证书，只生成 _CodeSignature/CodeResources。
      - name: 构建（不签名）
        run: flutter build ios --release --no-codesign

      - name: ad-hoc 签名（让产物具备签名结构，Sideloadly 才接受）
        run: |
          set -e
          APP=build/ios/iphoneos/Runner.app
          codesign --force --deep --sign - "$APP"
          echo "=== 主 bundle 签名信息 ==="
          codesign -dv "$APP" 2>&1 | head -8
          echo "=== _CodeSignature 是否生成 ==="
          ls -la "$APP/_CodeSignature/" || { echo "!! 仍无 _CodeSignature"; exit 1; }

      # 构建失败时把 Podfile 打出来——ML Kit / Podfile platform 是最常见的失败点
      - name: 失败时输出 Podfile（诊断用）
        if: failure()
        run: |
          echo "=== ios/Podfile ==="
          cat ios/Podfile 2>/dev/null || echo "(Podfile 未生成)"
          echo "=== build 目录 ==="
          ls -la build/ios/iphoneos/ 2>/dev/null || true

      - name: 打包成未签名 IPA
        run: |
          set -e
          cd build/ios/iphoneos
          rm -rf Payload
          mkdir -p Payload
          cp -R Runner.app Payload/
          zip -qry "$GITHUB_WORKSPACE/HITable-unsigned.ipa" Payload
          ls -lh "$GITHUB_WORKSPACE/HITable-unsigned.ipa"

      - uses: actions/upload-artifact@v4
        with:
          name: HITable-unsigned-ipa
          path: HITable-unsigned.ipa
          retention-days: 14
