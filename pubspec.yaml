name: offline_course_schedule
description: HITable —— 哈尔滨工业大学学生的本地优先课程表应用，支持校园网内从教务系统导入课表。
publish_to: 'none'
version: 1.2.0+2017

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  android_intent_plus: ^6.1.0
  csv: ^6.0.0
  excel: ^4.0.6
  file_picker: ^13.1.0
  flutter_local_notifications: ^22.0.0
  flutter_riverpod: ^2.6.1
  flutter_timezone: ^5.1.0
  google_mlkit_text_recognition: ^0.16.0
  path: ^1.9.0
  sqflite: ^2.3.3+1
  timezone: ^0.11.1
  webview_flutter: ^4.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  sqflite_common_ffi: 2.3.4+4
  sqlite3: 2.9.4

flutter:
  uses-material-design: true
